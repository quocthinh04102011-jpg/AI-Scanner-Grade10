
name: AI Scanner Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source ZIP
        run: |
          unzip -o AI_Scanner_Grade10_Starter.zip

      - name: Build USER APK
        working-directory: ai_scanner_grade10/user-android
        run: gradle assembleDebug

      - name: Build ADMIN APK
        working-directory: ai_scanner_grade10/admin-android
        run: gradle assembleDebug

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: AI-Scanner-Grade10-APKs
          path: |
            ai_scanner_grade10/user-android/app/build/outputs/apk/debug/*.apk
            ai_scanner_grade10/admin-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
