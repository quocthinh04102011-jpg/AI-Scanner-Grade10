
name: AI Scanner Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lay ma nguon GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cai Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Cai Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"

      # 4. Cai Android packages
      # Khong cai package tools cu
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses

      # 5. Cai Gradle 8.9
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 6. Tim ZIP ma nguon
      - name: Find source ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="AI_Scanner_Grade10_Starter.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Khong tim thay ZIP"
            echo "Danh sach file:"
            ls -la
            exit 1
          fi

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 7. Giai nen ma nguon
      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          mkdir -p source

          unzip -o "${{ steps.zip.outputs.zip }}" -d source

          echo "Danh sach thu muc:"
          find source -maxdepth 4 -type d

      # 8. Tim thu muc USER va ADMIN
      - name: Locate Android projects
        id: projects
        shell: bash
        run: |
          set -e

          USER_DIR=$(find source -type d -name user-android | head -n 1)
          ADMIN_DIR=$(find source -type d -name admin-android | head -n 1)

          if [ -z "$USER_DIR" ]; then
            echo "ERROR: Khong tim thay user-android"
            find source -maxdepth 5 -type d
            exit 1
          fi

          if [ -z "$ADMIN_DIR" ]; then
            echo "ERROR: Khong tim thay admin-android"
            find source -maxdepth 5 -type d
            exit 1
          fi

          echo "user_dir=$USER_DIR" >> "$GITHUB_OUTPUT"
          echo "admin_dir=$ADMIN_DIR" >> "$GITHUB_OUTPUT"

      # 9. Build USER APK
      - name: Build USER APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.projects.outputs.user_dir }}"

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: USER project thieu settings.gradle"
            ls -la
            exit 1
          fi

          gradle assembleDebug

      # 10. Build ADMIN APK
      - name: Build ADMIN APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.projects.outputs.admin_dir }}"

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: ADMIN project thieu settings.gradle"
            ls -la
            exit 1
          fi

          gradle assembleDebug

      # 11. Kiem tra APK
      - name: Check APK files
        shell: bash
        run: |
          set -e

          USER_APK="${{ steps.projects.outputs.user_dir }}/app/build/outputs/apk/debug"
          ADMIN_APK="${{ steps.projects.outputs.admin_dir }}/app/build/outputs/apk/debug"

          echo "USER APK:"
          find "$USER_APK" -name "*.apk"

          echo "ADMIN APK:"
          find "$ADMIN_APK" -name "*.apk"

      # 12. Upload APK
      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: AI-Scanner-Grade10-APKs
          path: |
            ${{ steps.projects.outputs.user_dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.projects.outputs.admin_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
