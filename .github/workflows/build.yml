
name: AI Scanner Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check and extract ZIP
        run: |
          echo "Checking source ZIP..."

          if [ ! -f "AI_Scanner_Grade10_Starter.zip" ]; then
            echo "ERROR: Source ZIP not found"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          unzip -o AI_Scanner_Grade10_Starter.zip

          echo "Extracted folders:"
          ls -la
          ls -la ai_scanner_grade10

      - name: Build USER APK
        working-directory: ai_scanner_grade10/user-android
        run: gradle assembleDebug

      - name: Build ADMIN APK
        working-directory: ai_scanner_grade10/admin-android
        run: gradle assembleDebug

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: AI-Scanner-Grade10-APKs
          path: |
            ai_scanner_grade10/user-android/app/build/outputs/apk/debug/*.apk
            ai_scanner_grade10/admin-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
