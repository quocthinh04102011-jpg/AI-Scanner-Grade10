
name: AI Scanner Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build AI Scanner USER and ADMIN
    runs-on: ubuntu-latest

    steps:
      # 1. Lay ma nguon tu GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cai Android SDK va chap nhan license
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 3. Cai Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Tim file ZIP nguon
      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          set -e

          ZIP_FILE="AI_Scanner_Grade10_Starter.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Khong tim thay $ZIP_FILE"
            echo "Cac file ZIP hien co:"
            find . -type f -iname "*.zip"
            exit 1
          fi

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 5. Giai nen ma nguon
      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          mkdir -p source

          unzip -o "${{ steps.source.outputs.zip }}" -d source

          echo "Danh sach file sau khi giai nen:"
          find source -maxdepth 5 -type f | head -200

      # 6. Tim project USER
      - name: Locate USER project
        id: user
        shell: bash
        run: |
          set -e

          USER_DIR="$(find source -type f -name gradlew \
            -printf '%h\n' | grep 'user-android' | head -1)"

          if [ -z "$USER_DIR" ]; then
            echo "ERROR: Khong tim thay project USER"
            find source -type f -name gradlew
            exit 1
          fi

          echo "dir=$USER_DIR" >> "$GITHUB_OUTPUT"

      # 7. Tim project ADMIN
      - name: Locate ADMIN project
        id: admin
        shell: bash
        run: |
          set -e

          ADMIN_DIR="$(find source -type f -name gradlew \
            -printf '%h\n' | grep 'admin-android' | head -1)"

          if [ -z "$ADMIN_DIR" ]; then
            echo "ERROR: Khong tim thay project ADMIN"
            find source -type f -name gradlew
            exit 1
          fi

          echo "dir=$ADMIN_DIR" >> "$GITHUB_OUTPUT"

      # 8. Kiem tra Java va Gradle
      - name: Check build tools
        shell: bash
        run: |
          java -version

          echo "USER project:"
          ls -la "${{ steps.user.outputs.dir }}"

          echo "ADMIN project:"
          ls -la "${{ steps.admin.outputs.dir }}"

      # 9. Build APK USER
      - name: Build USER APK
        working-directory: ${{ steps.user.outputs.dir }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 10. Build APK ADMIN
      - name: Build ADMIN APK
        working-directory: ${{ steps.admin.outputs.dir }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 11. Tim APK USER
      - name: Locate USER APK
        id: userapk
        shell: bash
        run: |
          set -e

          APK="$(find "${{ steps.user.outputs.dir }}" \
            -type f -name '*.apk' \
            -path '*/outputs/apk/debug/*' | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Khong tim thay APK USER"
            find "${{ steps.user.outputs.dir }}" -type f -name '*.apk'
            exit 1
          fi

          mkdir -p output

          cp "$APK" output/AI-Scanner-USER.apk

          echo "apk=output/AI-Scanner-USER.apk" >> "$GITHUB_OUTPUT"

      # 12. Tim APK ADMIN
      - name: Locate ADMIN APK
        id: adminapk
        shell: bash
        run: |
          set -e

          APK="$(find "${{ steps.admin.outputs.dir }}" \
            -type f -name '*.apk' \
            -path '*/outputs/apk/debug/*' | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Khong tim thay APK ADMIN"
            find "${{ steps.admin.outputs.dir }}" -type f -name '*.apk'
            exit 1
          fi

          cp "$APK" output/AI-Scanner-ADMIN.apk

          echo "apk=output/AI-Scanner-ADMIN.apk" >> "$GITHUB_OUTPUT"

      # 13. Kiem tra APK
      - name: Check APK files
        shell: bash
        run: |
          set -e

          test -s output/AI-Scanner-USER.apk
          test -s output/AI-Scanner-ADMIN.apk

          ls -lh output/

      # 14. Upload APK
      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: AI-Scanner-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
