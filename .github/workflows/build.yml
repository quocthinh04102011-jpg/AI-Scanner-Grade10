name: Build and Test Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./ai_scanner_grade10/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  build-android:
    name: Build Android Apps (User & Admin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: |
          chmod +x ./ai_scanner_grade10/user-android/gradlew
          chmod +x ./ai_scanner_grade10/admin-android/gradlew

      - name: Build User Android App (Debug APK)
        working-directory: ./ai_scanner_grade10/user-android
        run: ./gradlew assembleDebug

      - name: Build Admin Android App (Debug APK)
        working-directory: ./ai_scanner_grade10/admin-android
        run: ./gradlew assembleDebug

      - name: Upload User APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-debug-apk
          path: ./ai_scanner_grade10/user-android/app/build/outputs/apk/debug/*.apk

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-debug-apk
          path: ./ai_scanner_grade10/admin-android/app/build/outputs/apk/debug/*.apk
